<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ResumeAI — Resume Analyzer</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header class="nav"><div class="brand">Resume<span>AI</span></div><a href="https://github.com/mohammedsohaib04/ai-resume-analyzer-job-matcher" target="_blank">GitHub ↗</a></header>
<main><section class="hero"><div class="badge">AI-POWERED CAREER TOOL</div><h1>Know how well your resume<br><span>matches the job.</span></h1><p>Upload your resume, paste a job description, and get a skill match score with actionable improvement suggestions.</p></section>
<section class="card"><form id="form"><div class="grid"><div><label>Resume PDF</label><label class="upload"><input id="resume" name="resume" type="file" accept=".pdf"><strong>📄 Choose PDF</strong><small id="filename">Maximum 5 MB</small></label></div><div><label>Job Description</label><textarea name="job_description" placeholder="Paste the job description here..."></textarea></div></div><button id="btn">Analyze My Resume →</button></form></section>
<section id="error" class="error"></section><section id="results" class="results hidden"><div class="score-card"><div><small>MATCH SCORE</small><div class="score" id="score">0%</div><p id="summary"></p></div><div class="ring" id="ring"></div></div><div class="columns"><div class="result-card"><h3>✓ Matched Skills</h3><div id="matched" class="chips"></div></div><div class="result-card"><h3>＋ Missing Skills</h3><div id="missing" class="chips"></div></div></div><div class="result-card"><h3>💡 Improvement Suggestions</h3><ul id="suggestions"></ul></div></section></main><script src="/static/script.js"></script></body></html>
